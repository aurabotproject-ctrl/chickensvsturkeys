<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Report · Chickens vs Turkeys</title>
  <link rel="stylesheet" href="../css/tokens.css?v=20261010134958">
  <link rel="stylesheet" href="../css/ui.css?v=20261010134958">
  <link rel="stylesheet" href="report.css?v=20261010134958">
</head>
<body>
  <div class="toolbar no-print" id="toolbar">
    <a class="btn sm grey" href="./?view=results">← Results</a>
    <button class="btn sm yellow" id="print">🖨️ Print / Save PDF</button>
    <label class="tchk"><input type="checkbox" data-sec="overview" checked> Overview</label>
    <label class="tchk"><input type="checkbox" data-sec="matrix" checked> Student matrix</label>
    <label class="tchk"><input type="checkbox" data-sec="questions" checked> Questions</label>
    <label class="tchk"><input type="checkbox" data-sec="slips"> Student slips</label>
    <select class="select" id="sort" title="Sort students">
      <option value="name">Sort: name</option>
      <option value="acc">Sort: accuracy</option>
      <option value="blind">Sort: blind spots</option>
    </select>
    <label class="tchk"><input type="checkbox" id="initials"> Initials only</label>
    <button class="btn sm purple" id="csv">⬇️ CSV</button>
  </div>
  <main id="report"><div class="loading-screen"><img class="egg" src="../assets/sprites/egg.webp" alt=""><b>LOADING…</b><small>Crunching the numbers…</small></div></main>
  <script type="module" src="report.js?v=20261010134958"></script>
</body>
</html>
