<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chickens vs Turkeys — drawn in code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111; --chicken: #2f7de1; --turkey: #e0402a; --yolk: #ffc72c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px;
    font-family: 'Nunito', system-ui, sans-serif; color: #fff;
    background: radial-gradient(circle at 50% 35%, #1d3f8c 0%, #0c1f4d 55%, #06122e 100%);
  }
  h1 { margin: 0; font-family: 'Bangers', Impact, sans-serif; font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: .05em; text-shadow: 4px 4px 0 var(--ink); transition: color .3s; }
  h1.chicken { color: #6fb2ff; } h1.turkey { color: #ff8a6b; }
  canvas { width: min(560px, 92vw); height: auto; aspect-ratio: 1; display: block; }
  .stage { position: relative; border: 5px solid var(--ink); border-radius: 28px; box-shadow: 8px 8px 0 var(--ink); overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #fff6d8, #ffd77a 70%, #f5b942); }
  button {
    font-family: 'Bangers', Impact, sans-serif; font-size: 1.8rem; letter-spacing: .06em; color: #fff; cursor: pointer;
    padding: .35em 1.2em; border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink);
    text-shadow: 2px 2px 0 var(--ink); transition: transform .1s, box-shadow .1s, background .3s;
  }
  button:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  button.to-turkey { background: var(--turkey); } button.to-chicken { background: var(--chicken); }
  p { margin: 0; opacity: .8; font-weight: 800; text-align: center; }
  /* live code editor */
  .editor { width: min(900px, 100%); margin-top: 10px; border: 5px solid var(--ink); border-radius: 22px; box-shadow: 8px 8px 0 var(--ink); overflow: hidden; background: #282a36; }
  .ed-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #06122e; border-bottom: 4px solid var(--ink); flex-wrap: wrap; }
  #code-title { font-family: 'Bangers', Impact, sans-serif; font-size: 1.6rem; letter-spacing: .05em; text-shadow: 2px 2px 0 var(--ink); margin-right: auto; }
  #code-title.chicken { color: #6fb2ff; } #code-title.turkey { color: #ff8a6b; }
  .ed-head button { font-size: 1.1rem; padding: .2em .8em; border-width: 3px; box-shadow: 0 4px 0 var(--ink); background: #5b6477; }
  .ed-head .tip { font-size: .85rem; opacity: .85; font-weight: 800; flex-basis: 100%; }
  .ed-head code { background: #ffffff1f; padding: 0 .3em; border-radius: 5px; }
  #code { width: 100%; height: 460px; border: 0; padding: 12px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; background: #282a36; color: #f8f8f2; resize: vertical; }
  .CodeMirror { height: 460px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #status { padding: 8px 14px; font-weight: 900; border-top: 4px solid var(--ink); font-size: .95rem; }
  #status.ok { background: #1f7a32; } #status.bad { background: #b3261e; }
</style>
</head>
<body>
  <h1 id="title" class="chicken">Team Chickens</h1>
  <div class="stage"><canvas id="c" width="1200" height="1200"></canvas></div>
  <button id="swap" class="to-turkey">Turn into a Turkey!</button>
  <p>Every line, colour and feather here is drawn with JavaScript on a canvas — no images.</p>
  <div class="editor">
    <div class="ed-head">
      <span id="code-title" class="chicken">🐔 Chicken code</span>
      <button id="reset" type="button">↺ Reset this bird</button>
      <span class="tip">Edit the code — the bird changes as you type. Try changing <code>blue: '#2f7de1'</code> to <code>'#00c853'</code>, or the beak's <code>62</code> to <code>120</code>.</span>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div id="status" class="ok">✓ Running the original code</div>
  </div>
<script type="text/plain" id="src-chicken">
// =====================================================================
//   THE CHICKEN — edit me! Colours are in C at the top. Positions are
//   x (0 = left, 600 = right) and y (0 = top, 600 = bottom).
// =====================================================================
function drawChicken(t, blink) {
  const C = { white: '#fbf8f0', shade: '#dcd5c6', red: '#e53b2a', redDark: '#b02a1c', blue: '#2f7de1', blueDark: '#174f9e' };

  // tail feathers fanning out behind
  for (const [a, len] of [[-2.5, 92], [-2.85, 100], [-3.2, 88], [-3.5, 70]]) {
    const wob = Math.sin(t * 2 + a) * 0.04;
    shape(ell(185 + Math.cos(a + wob) * 40, 300 + Math.sin(a + wob) * 40, len * 0.62, 26, a + wob), C.white);
  }
  legs(t);

  // comb (behind the head)
  blob([circ(330, 140, 26), circ(366, 126, 31), circ(402, 142, 24), ell(366, 160, 50, 22)], C.red);
  shadeInside(() => { circ(366, 126, 31)(); }, () => { ctx.fillStyle = C.redDark; ctx.beginPath(); ctx.arc(352, 140, 28, 0, Math.PI * 2); ctx.fill(); });

  // body + head as one fluffy blob
  const body = ell(292, 335, 122, 104); const head = circ(362, 218, 78); const neck = ell(335, 270, 62, 60);
  blob([body, head, neck], C.white);
  // cel shading along the bottom/back
  shadeInside(body, () => { ctx.fillStyle = C.shade; ctx.beginPath(); ctx.ellipse(270, 410, 150, 70, -0.15, 0, Math.PI * 2); ctx.fill(); });
  // chest fluff scallops
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(368 + i * 6, 305 + i * 22, 16, -0.6, 1.4); ctx.lineWidth = 4; ctx.strokeStyle = C.shade; ctx.stroke(); }

  headband(362, 218, 78, C.blue, C.blueDark, t);
  eye(390, 222, blink);
  beak(424, 236);
  // wattle under the beak
  shape(() => { ctx.moveTo(424, 262); ctx.bezierCurveTo(446, 268, 446, 300, 428, 304); ctx.bezierCurveTo(410, 300, 410, 272, 424, 262); }, C.red);
  // rosy cheek
  shape(ell(360, 250, 14, 9), 'rgba(255,120,110,.45)', 0);

  // wing with a blue wristband, flapping a little
  ctx.save(); ctx.translate(300, 330); ctx.rotate(Math.sin(t * 3) * 0.06);
  shape(() => { ctx.moveTo(-60, -30); ctx.bezierCurveTo(-10, -60, 60, -30, 64, 20); ctx.bezierCurveTo(40, 40, 0, 48, -30, 30); ctx.bezierCurveTo(-60, 10, -70, -14, -60, -30); }, C.white);
  for (const [x, y] of [[-30, 14], [0, 24], [30, 22]]) { ctx.beginPath(); ctx.arc(x, y, 16, 0.2, 2.8); ctx.lineWidth = 4; ctx.strokeStyle = C.shade; ctx.stroke(); }
  wristband(44, 8, -0.9, C.blue);
  ctx.restore();
}
</script>
<script type="text/plain" id="src-turkey">
// =====================================================================
//   THE TURKEY — edit me! Colours are in T at the top, tail colours in RINGS.
//   x (0 = left, 600 = right) and y (0 = top, 600 = bottom).
// =====================================================================
function drawTurkey(t, blink) {
  const T = { brown: '#8a5328', brownDark: '#5f3618', cream: '#f3d39a', red: '#d8402b', head: '#e5543c', headDark: '#b8361f', band: '#d62828', bandDark: '#8e1414' };
  const RINGS = [
    { len: 205, color: '#d8402b', tip: '#9c2416' },
    { len: 178, color: '#f08a24', tip: '#c45f0e' },
    { len: 150, color: '#f5c242', tip: '#d39a12' },
    { len: 122, color: '#2a9d8f', tip: '#1b6b61' },
  ];
  // the giant fanned tail, swaying slowly
  const cx = 268; const cy = 318; const sway = Math.sin(t * 1.6) * 0.03;
  RINGS.forEach((ring, k) => {
    const n = 11 - k; const from = -Math.PI * 1.04; const to = -Math.PI * -0.02;
    for (let i = 0; i < n; i++) {
      const a = from + ((to - from) * (i + 0.5 + (k % 2) * 0.5)) / (n + (k % 2)) + sway;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
      shape(() => ctx.ellipse(ring.len * 0.55, 0, ring.len * 0.5, 30 - k * 2, 0, 0, Math.PI * 2), ring.color);
      // darker band near the tip of each feather
      shadeInside(() => ctx.ellipse(ring.len * 0.55, 0, ring.len * 0.5, 30 - k * 2, 0, 0, Math.PI * 2),
        () => { ctx.fillStyle = ring.tip; ctx.fillRect(ring.len * 0.88, -40, 60, 80); });
      ctx.restore();
    }
  });
  legs(t);

  // body + neck + head as one blob
  const body = ell(292, 340, 126, 108); const neck = ell(352, 262, 50, 64, 0.3); const head = circ(372, 206, 62);
  blob([body, neck], T.brown);
  shadeInside(body, () => { ctx.fillStyle = T.brownDark; ctx.beginPath(); ctx.ellipse(250, 420, 160, 70, -0.1, 0, Math.PI * 2); ctx.fill(); });
  // cream chest bib with feather scallops (the turkey's proud chest)
  shadeInside(body, () => {
    shape(ell(392, 330, 62, 92, -0.2), T.cream, 5);
    shadeInside(ell(392, 330, 62, 92, -0.2), () => {
      for (let row = 0; row < 6; row++) for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.arc(345 + i * 26 + (row % 2) * 13, 262 + row * 26, 14, 0.25, Math.PI - 0.25);
        ctx.lineWidth = 3.5; ctx.strokeStyle = '#c99a55'; ctx.stroke();
      }
    });
  });
  // head (red-orange like the art)
  shape(head, T.head);
  shadeInside(head, () => { ctx.fillStyle = T.headDark; ctx.beginPath(); ctx.arc(340, 240, 52, 0, Math.PI * 2); ctx.fill(); });

  headband(372, 206, 62, T.band, T.bandDark, t);
  eye(398, 212, blink, 0.38);
  beak(430, 226);
  // the snood draping over the beak + a big wattle under the chin
  const sw = Math.sin(t * 4) * 3;
  shape(() => { ctx.moveTo(430, 206); ctx.bezierCurveTo(446, 206, 452 + sw, 236, 444 + sw, 258); ctx.bezierCurveTo(436 + sw, 262, 430, 238, 426, 214); ctx.closePath(); }, T.red, 5);
  shape(() => { ctx.moveTo(420, 250); ctx.bezierCurveTo(456, 262, 452, 318, 426, 322); ctx.bezierCurveTo(398, 318, 396, 272, 420, 250); }, T.red);
  shape(ell(410, 290, 8, 14), 'rgba(255,255,255,.18)', 0);

  // wing with a red wristband
  ctx.save(); ctx.translate(290, 336); ctx.rotate(Math.sin(t * 3) * 0.06);
  shape(() => { ctx.moveTo(-66, -34); ctx.bezierCurveTo(-10, -66, 66, -32, 70, 22); ctx.bezierCurveTo(44, 44, 0, 52, -34, 32); ctx.bezierCurveTo(-66, 12, -76, -16, -66, -34); }, T.brownDark);
  for (const [x, y] of [[-34, 14], [-2, 26], [32, 24]]) { ctx.beginPath(); ctx.arc(x, y, 17, 0.2, 2.8); ctx.lineWidth = 4; ctx.strokeStyle = T.brown; ctx.stroke(); }
  wristband(48, 8, -0.9, T.band);
  ctx.restore();
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

<script>
// =====================================================================
// Chickens vs Turkeys characters, drawn only with JavaScript (Canvas 2D).
// The drawing area is 600 × 600 "units"; the canvas is 2× for sharpness.
// =====================================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.scale(2, 2);

const INK = '#141414';
const OUT = 7; // outline thickness

// ---------- little drawing helpers ----------
/** Fill a path, then outline it in thick comic-book ink. */
function shape(build, fill, line = OUT) {
  ctx.beginPath(); build(); ctx.fillStyle = fill; ctx.fill();
  if (line) { ctx.lineWidth = line; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
}
/**
 * Several shapes that should look like ONE blob with a single outline (e.g. head + body):
 * stroke them all thickly first, then fill them all on top, so the inside lines disappear.
 */
function blob(builders, fill, line = OUT) {
  ctx.lineWidth = line * 2; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
  for (const b of builders) { ctx.beginPath(); b(); ctx.stroke(); }
  ctx.fillStyle = fill;
  for (const b of builders) { ctx.beginPath(); b(); ctx.fill(); }
}
const ell = (x, y, rx, ry, rot = 0) => () => ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
const circ = (x, y, r) => () => ctx.arc(x, y, r, 0, Math.PI * 2);
/** Cel shading: paint `fill` only inside the clip shape. */
function shadeInside(clipBuild, paint) {
  ctx.save(); ctx.beginPath(); clipBuild(); ctx.clip(); paint(); ctx.restore();
}
function line(points, width, color = INK) {
  ctx.beginPath(); ctx.moveTo(...points[0]);
  for (const p of points.slice(1)) ctx.lineTo(...p);
  ctx.lineWidth = width; ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}

// ---------- parts both birds share ----------
function legs(t) {
  for (const [x, lean] of [[262, -6], [338, 6]]) {
    // leg = an orange stick with an ink outline
    line([[x, 405], [x + lean, 470]], 22); line([[x, 405], [x + lean, 470]], 11, '#f39a1d');
    // three chunky toes
    const fx = x + lean; const fy = 472;
    for (const a of [-2.5, -1.57, -0.6]) {
      const tx = fx + Math.cos(a + Math.PI) * -34 * (a === -1.57 ? 0.2 : 1); const ty = fy + 16 + (a === -1.57 ? 8 : 0);
      const toe = [[fx, fy], [fx + (a < -2 ? -34 : a > -1 ? 34 : 4), ty]];
      line(toe, 22); line(toe, 11, '#f39a1d');
    }
  }
}

/** The angry hero eye. look = which way the pupil points; blink 0..1 closes it. */
function eye(x, y, blink, browTilt = 0.32) {
  const open = 1 - blink;
  if (open > 0.08) {
    shape(ell(x, y, 22, 26 * open), '#fff', 5);
    shadeInside(ell(x, y, 22, 26 * open), () => {
      shape(circ(x + 8, y + 4, 11), INK, 0);
      shape(circ(x + 12, y - 1, 3.6), '#fff', 0);
    });
  } else line([[x - 20, y], [x + 20, y]], 6);
  // the determined brow
  ctx.save(); ctx.translate(x, y - 30); ctx.rotate(browTilt);
  shape(() => ctx.roundRect(-30, -8, 58, 15, 7), INK, 0);
  ctx.restore();
}

function beak(x, y) {
  shape(() => { ctx.moveTo(x, y - 20); ctx.quadraticCurveTo(x + 40, y - 14, x + 62, y + 6); ctx.quadraticCurveTo(x + 36, y + 22, x, y + 24); ctx.closePath(); }, '#ffc72c');
  shadeInside(() => { ctx.moveTo(x, y - 20); ctx.quadraticCurveTo(x + 40, y - 14, x + 62, y + 6); ctx.quadraticCurveTo(x + 36, y + 22, x, y + 24); ctx.closePath(); },
    () => { ctx.fillStyle = '#e8961a'; ctx.fillRect(x - 5, y + 6, 80, 30); });
  line([[x + 6, y + 5], [x + 50, y + 6]], 4);
}

/** Headband across the forehead with its knot and two tails blowing behind. */
function headband(cx, cy, r, color, dark, t) {
  const top = -r * 0.7; const h = r * 0.38; const tilt = -0.1;
  const bandRect = () => { const m = ctx.getTransform(); ctx.translate(cx, cy); ctx.rotate(tilt); ctx.rect(-r - 12, top, r * 2 + 24, h); ctx.setTransform(m); };
  // tails flapping in the wind (behind the head, so draw first)
  const kx = cx - r * 0.86; const ky = cy + top * 0.72 + 6;
  for (const [len, lift, ph] of [[100, -26, 0], [84, 16, 1.7]]) {
    const w = Math.sin(t * 7 + ph) * 10;
    shape(() => {
      ctx.moveTo(kx, ky - 8);
      ctx.bezierCurveTo(kx - len * 0.35, ky - 16 + lift + w, kx - len * 0.7, ky + lift - w, kx - len, ky + lift + w);
      ctx.lineTo(kx - len + 8, ky + lift + 20 + w);
      ctx.bezierCurveTo(kx - len * 0.65, ky + lift + 14 - w, kx - len * 0.35, ky + 6 + lift + w, kx, ky + 12);
      ctx.closePath();
    }, color);
  }
  // the band itself, clipped to the head so it wraps around it
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r + OUT / 2, 0, Math.PI * 2); ctx.clip();
  shape(bandRect, color);
  ctx.save(); ctx.beginPath(); bandRect(); ctx.clip();
  ctx.fillStyle = dark; ctx.translate(cx, cy); ctx.rotate(tilt); ctx.fillRect(-r - 12, top + h * 0.62, r * 2 + 24, h * 0.38); ctx.restore();
  ctx.restore();
  // put the head's outline back where the band covered it
  ctx.save(); ctx.beginPath(); bandRect(); ctx.clip();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = OUT; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
  shape(circ(kx, ky + 2, 15), color); // the knot
  shape(circ(kx - 2, ky, 5), dark, 0);
}

function wristband(x, y, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  shape(() => ctx.roundRect(-24, -13, 48, 26, 9), color);
  line([[-18, 0], [18, 0]], 3, 'rgba(255,255,255,.5)');
  ctx.restore();
}

// =====================================================================
//                        animation + the swap button
// =====================================================================
let who = 'chicken';
let morph = null;            // { t0, to } while changing
const puffs = [];            // feather particles for the POOF
let nextBlink = 2; let blinkAt = -1;

function background(t) {
  ctx.clearRect(0, 0, 600, 600);
  // speed-line sunburst in the team colour
  ctx.save(); ctx.translate(300, 300); ctx.rotate(t * 0.05);
  ctx.fillStyle = who === 'chicken' ? 'rgba(47,125,225,.13)' : 'rgba(224,64,42,.13)';
  for (let i = 0; i < 16; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 520, (i / 16) * Math.PI * 2, ((i + 0.5) / 16) * Math.PI * 2); ctx.fill(); }
  ctx.restore();
  // ground shadow
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(300, 498, 150, 22, 0, 0, Math.PI * 2); ctx.fill();
}

function frame(ms) {
  const t = ms / 1000;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.globalAlpha = 1;
  background(t);

  // blinking every few seconds
  if (t > nextBlink) { blinkAt = t; nextBlink = t + 2.5 + Math.random() * 2.5; }
  const bk = blinkAt >= 0 ? Math.max(0, 1 - Math.abs(t - blinkAt - 0.08) / 0.08) : 0;

  // the morph: squash down, swap at the middle, pop back up
  let sx = 1; let sy = 1;
  if (morph) {
    const k = (t - morph.t0) / 0.7;
    if (k >= 0.5 && who !== morph.to) { who = morph.to; burst(); }
    if (k >= 1) morph = null;
    else { const s = Math.sin(Math.min(1, k) * Math.PI); sx = 1 + s * 0.35; sy = 1 - s * 0.75; }
  }

  // gentle breathing bob
  const bob = Math.sin(t * 2.4) * 4;
  ctx.save();
  ctx.translate(300, 500); ctx.scale(sx, sy * (1 + Math.sin(t * 2.4) * 0.012)); ctx.translate(-300, -500 + bob * (morph ? 0 : 1));
  drawBird(who, t, bk);
  ctx.restore();

  drawPuffs(t);
  requestAnimationFrame(frame);
}

function burst() {
  const now = performance.now() / 1000;
  const colors = who === 'turkey' ? ['#d8402b', '#f08a24', '#f5c242', '#2a9d8f', '#8a5328'] : ['#fbf8f0', '#2f7de1', '#e53b2a', '#fbf8f0'];
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2; const v = 120 + Math.random() * 260;
    puffs.push({ x: 300, y: 330, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, c: colors[i % colors.length], t0: now, s: 0.7 + Math.random() * 0.6 });
  }
  puffs.push({ text: true, t0: now });
}
function drawPuffs() {
  const now = performance.now() / 1000;
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; const age = now - p.t0;
    if (age > 1.3) { puffs.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - age / 1.3);
    if (p.text) {
      const s = 1 + Math.min(age * 4, 1) * 0.3;
      ctx.translate(300, 140); ctx.scale(s, s); ctx.rotate(-0.08);
      ctx.font = '72px Bangers, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
      ctx.strokeText('POOF!', 0, 0); ctx.fillStyle = '#ffc72c'; ctx.fillText('POOF!', 0, 0);
    } else {
      // a little feather: an outlined leaf shape tumbling as it falls
      const x = p.x + p.vx * age; const y = p.y + p.vy * age + 260 * age * age;
      ctx.translate(x, y); ctx.rotate(p.rot + p.vr * age); ctx.scale(p.s, p.s);
      shape(() => ctx.ellipse(0, 0, 20, 8, 0, 0, Math.PI * 2), p.c, 4);
      line([[-16, 0], [16, 0]], 2, 'rgba(0,0,0,.35)');
    }
    ctx.restore();
  }
}


// =====================================================================
//              the LIVE CODE editor: type → the bird redraws
// =====================================================================
const ORIGINAL = { chicken: document.getElementById('src-chicken').textContent.trim(), turkey: document.getElementById('src-turkey').textContent.trim() };
const code = { ...ORIGINAL };          // what's in the editor for each bird
const good = {};                       // the last version of each bird that worked
const status = document.getElementById('status');
const FN = { chicken: 'drawChicken', turkey: 'drawTurkey' };

/** Turn the text into a drawing function (or explain what's wrong with it). */
function compile(bird, text) {
  try {
    const fn = new Function(`${text}\nreturn typeof ${FN[bird]} === 'function' ? ${FN[bird]} : null;`)();
    if (!fn) return { error: `Keep the line "function ${FN[bird]}(t, blink) {" — that's how the page finds the drawing.` };
    return { fn };
  } catch (e) { return { error: friendly(e) }; }
}
function friendly(e) {
  const m = String(e.stack || '').match(/<anonymous>:(\d+):\d+/);
  const lineNo = m ? +m[1] - 2 : null; // new Function adds 2 lines of its own at the top
  return `${lineNo ? `Line ${lineNo}: ` : ''}${e.name === 'SyntaxError' ? 'typo — ' : ''}${e.message}`;
}
function setStatus(ok, msg) { status.className = ok ? 'ok' : 'bad'; status.textContent = ok ? '✓ ' + msg : '⚠ ' + msg + '  (still showing the last version that worked)'; }

let pendingCheck = null; // a new version is "on trial" until it draws one frame without crashing
function tryCode(bird) {
  const r = compile(bird, code[bird]);
  if (r.error) { setStatus(false, r.error); return; }
  pendingCheck = { bird, fn: r.fn };
}
/** Draw the bird — with a safety net, so a mistake never breaks the page. */
function drawBird(bird, t, bk) {
  const trial = pendingCheck && pendingCheck.bird === bird ? pendingCheck.fn : null;
  const fn = trial || good[bird];
  if (!fn) return;
  ctx.save();
  try {
    fn(t, bk);
    if (trial) { good[bird] = trial; pendingCheck = null; setStatus(true, code[bird] === ORIGINAL[bird] ? 'Running the original code' : 'Running your code!'); }
  } catch (e) {
    for (let i = 0; i < 40; i++) ctx.restore(); // tidy up anything the broken code left half-done
    ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.globalAlpha = 1;
    if (trial) { pendingCheck = null; setStatus(false, friendly(e)); }
    return;
  }
  ctx.restore();
}
for (const b of ['chicken', 'turkey']) { good[b] = compile(b, ORIGINAL[b]).fn; }

// the editor: CodeMirror (colours + line numbers) if it loaded, otherwise a plain text box
const box = document.getElementById('code');
let editor = null;
if (window.CodeMirror) {
  editor = CodeMirror.fromTextArea(box, { mode: 'javascript', theme: 'dracula', lineNumbers: true, tabSize: 2, indentUnit: 2, lineWrapping: true });
  editor.on('change', () => onEdit(editor.getValue()));
} else box.addEventListener('input', () => onEdit(box.value));
const getText = () => (editor ? editor.getValue() : box.value);
const setText = (s) => { if (editor) { editor.setValue(s); editor.clearHistory(); } else box.value = s; };
let editT = 0;
function onEdit(text) {
  const bird = editingBird; code[bird] = text;
  clearTimeout(editT); editT = setTimeout(() => tryCode(bird), 250);
}
let editingBird = 'chicken';
function showCode(bird) {
  editingBird = bird; clearTimeout(editT); setText(code[bird]);
  document.getElementById('code-title').textContent = bird === 'chicken' ? '🐔 Chicken code' : '🦃 Turkey code';
  document.getElementById('code-title').className = bird;
  tryCode(bird);
}
document.getElementById('reset').addEventListener('click', () => { code[editingBird] = ORIGINAL[editingBird]; setText(ORIGINAL[editingBird]); tryCode(editingBird); });
showCode('chicken');

const btn = document.getElementById('swap'); const title = document.getElementById('title');
btn.addEventListener('click', () => {
  if (morph) return;
  const to = (morph?.to || who) === 'chicken' ? 'turkey' : 'chicken';
  morph = { t0: performance.now() / 1000, to };
  setTimeout(() => {
    title.textContent = to === 'turkey' ? 'Team Turkeys' : 'Team Chickens'; title.className = to;
    btn.textContent = to === 'turkey' ? 'Turn into a Chicken!' : 'Turn into a Turkey!';
    btn.className = to === 'turkey' ? 'to-chicken' : 'to-turkey';
    showCode(to);
  }, 350);
});

requestAnimationFrame(frame);
</script>
</body>
</html>
