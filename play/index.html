<!doctype html>
<html lang="en" data-auth="student">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f4b">
  <title>Join · Chickens vs Turkeys</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/ui.css">
  <link rel="stylesheet" href="play.css">
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
</head>
<body>
  <!-- JOIN -->
  <section id="join" class="screen">
    <img class="join-logo anim-pop" src="../assets/sprites/logo.webp" alt="Chickens vs Turkeys">
    <form id="join-form" class="panel light join-form" autocomplete="off">
      <label class="field"><span>Game code</span><input class="input code-input" id="code" maxlength="6" inputmode="text" autocapitalize="characters" placeholder="ABC123" required></label>
      <label class="field"><span>Your name</span><input class="input" id="name" maxlength="14" placeholder="First name" required></label>
      <button class="btn big" type="submit" id="join-btn">JOIN!</button>
      <p class="error-text" id="join-err"></p>
    </form>
  </section>

  <!-- WAITING / TEAM / AVATAR -->
  <section id="wait" class="screen hidden"></section>

  <!-- PLAYING -->
  <section id="play" class="screen hidden">
    <header class="ph">
      <img id="me-av" class="me-av" src="" alt="">
      <div class="me-info"><b id="me-name"></b><small id="me-team"></small></div>
      <div class="me-stat" title="KO points"><span>💥</span><b id="me-score">0</b></div>
      <div class="me-stat timer-chip"><span>⏱</span><b id="me-timer">--</b></div>
    </header>
    <nav class="tabs">
      <button id="tab-answer" class="tab on">❓ ANSWER</button>
      <button id="tab-fight" class="tab">🥚 FIGHT <span class="egg-count" id="egg-count">0</span></button>
    </nav>
    <div class="egg-bar" id="egg-bar"></div>

    <div id="view-answer" class="view">
      <div class="qprog hidden" id="qprog"></div>
      <div class="question panel light" id="question">Get ready…</div>
      <div class="answers" id="answers"></div>
      <div class="conf hidden" id="conf">
        <p>How sure are you?</p>
        <div class="conf-btns">
          <button data-conf="sure">🔥<b>Sure</b></button>
          <button data-conf="think">🤔<b>Think so</b></button>
          <button data-conf="guess">🎲<b>Guessing</b></button>
        </div>
      </div>
      <div class="fb hidden" id="fb"></div>
    </div>

    <div id="view-fight" class="view hidden">
      <div class="pad" id="pad">
        <div class="pad-half move"><div class="pad-hint">MOVE<br><small>drag here</small></div><img class="stick-base" id="stick-base" src="../assets/sprites/joystick.webp" alt=""><div class="stick-knob" id="stick-knob"></div></div>
        <div class="pad-half aim"><div class="pad-hint">AIM &amp; THROW<br><small>drag, then let go</small></div><img class="aim-base" id="aim-base" src="../assets/sprites/aimpad.webp" alt=""><div class="aim-arrow" id="aim-arrow"></div></div>
      </div>
      <div class="ko hidden" id="ko"></div>
    </div>
    <div id="view-cannon" class="view hidden">
      <div class="cn-info"><span id="cn-eggs">🥚 0 eggs</span><span id="cn-wind">NO WIND</span></div>
      <div class="cn-dial" id="cn-dial">
        <svg viewBox="0 0 220 130" aria-hidden="true">
          <path id="cn-arc" d="" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="22" stroke-linecap="round"/>
          <line id="cn-arrow" x1="0" y1="0" x2="0" y2="0" stroke="#ffc72c" stroke-width="10" stroke-linecap="round"/>
          <circle id="cn-tip" r="13" fill="#ffc72c" stroke="#111" stroke-width="4"/>
          <circle id="cn-pivot" r="12" fill="#fff" stroke="#111" stroke-width="4"/>
        </svg>
        <div class="cn-angle" id="cn-angle">45°</div>
        <div class="cn-hint">drag to aim</div>
      </div>
      <div class="cn-meter"><i id="cn-fill"></i><b id="cn-last" class="hidden"></b><span>POWER</span></div>
      <button id="cn-fire" class="btn big red cn-fire">🔥 FIRE!</button>
    </div>
    <div id="view-farm" class="view hidden">
      <div class="fm-top">
        <div class="fm-cash"><b id="fm-cash">$0</b><small id="fm-rate">+$0/s</small></div>
        <div class="fm-stat" title="Chickens"><img src="../assets/sprites/chicken_idle.webp" alt="" id="fm-chick-ico"><b id="fm-chickens">0</b><small id="fm-cap">/20</small></div>
        <div class="fm-stat" title="Trucks ship eggs/second"><img src="../assets/sprites/fm_van.webp" alt=""><b id="fm-ship">0</b><small>/s</small></div>
        <div class="fm-gold"><img src="../assets/sprites/fm_goldegg.webp" alt="golden eggs"><b id="fm-gold">0</b></div>
      </div>
      <div class="fm-alert hidden" id="fm-alert"></div>
      <div class="fm-wrap" id="fm-wrap">
        <div class="fm-scene" id="fm-scene"></div>
        <button class="fm-crate" id="fm-crate"><img src="../assets/sprites/fm_crate.webp" alt=""><span>ANSWER =<br><b>STAMPEDE!</b></span></button>
      </div>
      <div class="fm-controls">
        <button class="fm-hatch" id="fm-hatch" aria-label="Hold to hatch chickens">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="ring-bg"/><circle cx="50" cy="50" r="44" class="ring" id="fm-ring"/></svg>
          <span>HOLD TO<br><b>HATCH</b></span>
        </button>
        <div class="fm-shop" id="fm-shop"></div>
      </div>
      <div class="fm-sheet hidden" id="fm-research"><div class="fm-sheet-box panel light"><h2>🔬 Research <small>spend golden eggs</small></h2><div id="fm-rs-list" class="fm-rs-list"></div><button class="btn grey" id="fm-rs-close">Back to farm</button></div></div>
    </div>
    <div id="view-tw" class="view hidden">
      <div class="tw-top">
        <div class="tw-stat"><img src="../assets/sprites/tw_coop_c2.webp" alt="" id="tw-ico"><b id="tw-own">0</b><small>yours</small></div>
        <div class="tw-stat"><img src="../assets/sprites/tw_chick1.webp" alt="" id="tw-troop-ico"><b id="tw-troops">0</b><small>troops</small></div>
        <div class="tw-score"><span class="c">🐔 <b id="tw-tc">0</b></span><span class="t">🦃 <b id="tw-tt">0</b></span></div>
      </div>
      <div class="tw-hint" id="tw-hint">Drag from YOUR coop (gold ring) to another building to march troops. Swipe across your line to cut it.</div>
      <div class="tw-wrap"><div class="tw-scene" id="tw-scene"></div>
        <button class="fm-crate tw-crate" id="tw-crate"><img src="../assets/sprites/tw_crate.webp" alt=""><span>ANSWER =<br><b>+TROOPS!</b></span></button>
      </div>
    </div>
  </section>

  <div id="overlay" class="overlay hidden"></div>
  <script type="module" src="play.js"></script>
</body>
</html>
